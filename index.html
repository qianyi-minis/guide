<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千一工坊 組裝教學</title><style>:root{--navy:#081830;--navy2:#142e56;--gold:#d4aa50;--cream:#f3efe6;--ink:#0c1a32;--mut:#5a6473}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}header img{height:34px}header b{color:var(--gold);font-size:15px}
main{max-width:720px;margin:0 auto;padding:16px}h1{margin:8px 0 0;font-size:30px;letter-spacing:.5px}.sub{color:var(--mut);margin:0 0 12px}
.hero{width:100%;border-radius:12px;background:#fff}.step{background:#fff;border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:0 1px 3px #0001}
.step h2{margin:0;padding:10px 14px;font-size:17px;background:var(--navy);color:#fff}.step h2 span{color:var(--gold);margin-right:8px;font-style:italic}
.step img{width:100%;display:block}.tip{background:#fff;border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin:14px 0}
.warn{background:#fff;border-radius:12px;padding:12px 16px;margin:18px 0}.warn h3{margin:0 0 6px;font-size:16px;color:#a8322a}.warn li{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.grid a{display:block;background:#fff;border-radius:10px;padding:8px;text-decoration:none;color:var(--ink);text-align:center}
.grid img{width:100%}.grid b{display:block;font-size:17px}footer{color:var(--mut);font-size:13px;text-align:center;padding:24px 16px}a{color:var(--navy2)}</style></head><body>
