<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>千一工坊 訂單查詢</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14213d;--mute:#6b7280;--line:#e5e2d9;--gold:#c9a24a;--navy:#14213d;--ok:#1a7f4b;--warn:#b45309;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--ink:#eef0f4;--mute:#9aa3ad;--line:#2a3344;--navy:#0b1220}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{background:var(--navy);color:#fff;padding:22px 16px 18px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--gold);font-size:14px}
main{max-width:560px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{width:100%;margin-top:14px;font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#14213d}button:disabled{opacity:.6}
.err{color:var(--bad);margin-top:10px;font-size:14px}.mute{color:var(--mute);font-size:13px}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.oh b{font-size:17px}.amt{font-size:28px;font-weight:800}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;border:1px solid var(--line);margin:2px 4px 2px 0}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;margin:6px 0;font-size:15px}.row span:first-child{color:var(--mute);flex:none;width:68px}
a{color:var(--gold)}
</style></head><body>
<header><h1>⚓ 千一工坊 訂單查詢</h1><p>Q版艦艇 第一批預購</p></header>
<main>
<div class="card"><form id="f"><label>IG / Threads 帳號(跟表單填的一樣)</label><input id="a" autocomplete="username" placeholder="例 qianyi.minis" required>
<label>手機號碼末 3 碼</label><input id="p" inputmode="numeric" maxlength="3" placeholder="例 678" required><button id="b">查詢</button><div class="err" id="e"></div></form></div>
<div id="r"></div>
<p class="mute">有問題請私訊 IG <a href="https://www.instagram.com/qianyi.minis/">@qianyi.minis</a></p>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbx0nNYNGuoVxdRAkhwsf3tqfwKlyHR_xzKE5O-zboX6ooaaaQ39fO_X3v4_cpckaxzslg/exec';const $=id=>document.getElementById(id);const n=x=>Number(x||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(o){const st=o.status==='成立'?'<span class="tag ok">已成立</span>':o.status==='取消'?'<span class="tag bad">已取消</span>':'<span class="tag warn">'+esc(o.status)+'</span>';
 const prog=o.status==='取消'?'':o.pickup?(o.paid?'<span class="tag ok">已面交完成</span>':'<span class="tag">等待面交</span>'):(o.sent?'<span class="tag ok">已出貨</span>':o.link?'<span class="tag ok">已傳賣貨便連結</span>':'<span class="tag">準備中</span>');
 const ship=o.pickup?'面交當天現金付款':o.freeShip?'滿 $1,000 免運 🎉,取貨時付款':'另加運費約 $38–60,取貨時付款';
 return `<div class="card"><div class="oh"><b>${esc(o.id)}</b><span class="mute">${esc(o.time)}</span></div><div>${st}${prog}</div>
 <div class="row"><span>船</span><span>${esc(o.items)||'—'}</span></div>${o.detail?`<div class="row"><span>紀念座</span><span>${esc(o.detail)}</span></div>`:''}${o.box?`<div class="row"><span>加購</span><span>${esc(o.box)}</span></div>`:''}
 <div class="row"><span>取貨</span><span>${esc(o.where)}</span></div>${o.wait?`<div class="row"><span>候補</span><span>${esc(o.wait)}</span></div>`:''}
 <div class="oh" style="margin-top:10px"><span class="mute">${o.status==='取消'?'':ship}</span><span class="amt">$${n(o.due)}</span></div></div>`}
$('f').onsubmit=ev=>{ev.preventDefault();$('e').textContent='';$('r').innerHTML='';$('b').disabled=true;$('b').textContent='查詢中…';
 fetch(API+'?'+new URLSearchParams({api:'lookup',acct:$('a').value,p3:$('p').value})).then(r=>r.json()).then(d=>{if(d.error)throw new Error(d.error);
  const live=d.orders.filter(o=>o.status!=='取消'),tot=live.filter(o=>!/候補/.test(o.status)).reduce((a,o)=>a+o.due,0);
  $('r').innerHTML=(live.length>1?`<div class="card"><div class="oh"><b>合計(不含候補)</b><span class="amt">$${n(tot)}</span></div></div>`:'')+d.orders.map(card).join('')})
 .catch(e=>{$('e').textContent=e.message||'查詢失敗,請稍後再試'}).finally(()=>{$('b').disabled=false;$('b').textContent='查詢'})};
const q=new URLSearchParams(location.search);if(q.get('a'))$('a').value=q.get('a');
</script></body></html>
